spring.application.name=baseproject
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA  update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.token.secret-key=53cr37
security.jwt.token.expire-lenght=3600000

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Corrige o diretório temporário usado pelo Tomcat/Servlet no Windows
server.tomcat.basedir=C:/temp/baseproject-tomcat
spring.servlet.session.store-dir=C:/temp/baseproject-sessions

# opcional, para garantir tmp separado da máquina
java.io.tmpdir=C:/temp/baseproject-tmp

